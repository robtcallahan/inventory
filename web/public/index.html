<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Inventory</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1 class="site-header__title">Home Inventory</h1>
        <p class="site-header__subtitle">Protecting what matters</p>
    </header>

    <main class="inventory-panel">
        <div class="inventory-toolbar">
            <div class="inventory-toolbar__filter">
                <label class="field-label" for="category-filter">Category</label>
                <select class="select-control" id="category-filter">
                    <option value="">All</option>
                    <option>Appliances</option><option>Clothes</option><option>Computers</option>
                    <option>Electronics</option><option>Entertainment</option><option>Furniture</option>
                    <option>Gardening</option><option>Kitchen</option><option>Music Gear</option>
                    <option>Musical Instruments</option><option>Phones &amp; Tablets</option><option>Other</option>
                </select>
            </div>
            <div class="inventory-toolbar__search">
                <label class="field-label" for="search-filter">Search</label>
                <input class="input-control" id="search-filter" type="text">
            </div>
            <p class="inventory-toolbar__count">Total Items: <span id="inventory-count">0</span></p>
            <p class="inventory-toolbar__value">Total Value: <span id="inventory-value">$0</span></p>
            <button class="button button--primary" id="inventory-add" type="button">Add</button>
        </div>
        <div class="inventory-table-scroll">
            <table class="inventory-table">
                <thead id="inventory-table-head"></thead>
                <tbody id="inventory-table-body"></tbody>
            </table>
        </div>
    </main>

    <div class="item-dialog is-hidden" id="item-dialog" role="dialog" aria-modal="true" aria-labelledby="item-dialog-title">
        <div class="item-dialog__panel">
            <header class="item-dialog__header">
                <h2 class="item-dialog__title" id="item-dialog-title">Item Details</h2>
                <p class="item-dialog__subtitle">View or edit inventory information</p>
            </header>
            <form class="item-dialog__form" id="item-form">
                <div class="item-dialog__body">
                    <div class="item-fields" id="item-fields"></div>
                    <section class="item-photos" id="item-photos"><h3>Photos</h3><div id="item-photo-gallery" class="item-photo-gallery"></div><label class="button button--secondary is-hidden" id="item-photo-upload-label" for="item-photo-input">Add photo</label><input id="item-photo-input" type="file" accept="image/jpeg,image/png,image/gif,image/webp" class="is-hidden"><p id="item-photo-status" role="status"></p></section>
                    <p class="form-error is-hidden" id="item-form-error" role="alert"></p>
                </div>
                <footer class="item-dialog__actions">
                    <button class="button button--secondary" id="item-close" type="button">Close</button>
                    <button class="button button--primary" id="item-edit" type="button">Edit</button>
                    <button class="button button--danger is-hidden" id="item-delete" type="button">Delete</button>
                    <button class="button button--secondary is-hidden" id="item-cancel" type="button">Cancel</button>
                    <button class="button button--primary is-hidden" id="item-save" type="submit">Save</button>
                </footer>
            </form>
        </div>
    </div>

    <dialog id="photo-viewer"><button type="button" id="photo-viewer-close" class="button button--secondary">Close</button><img id="photo-viewer-image" alt="Inventory photo"></dialog>
    <dialog id="delete-confirm-dialog">
        <h2>Delete Item?</h2>
        <p id="delete-confirm-message"></p>
        <div class="dialog-actions">
            <button class="button button--secondary" type="button" id="cancel-delete">Cancel</button>
            <button class="button button--danger" type="button" id="confirm-delete">Delete</button>
        </div>
    </dialog>
</body>
</html>
